name: Governance rules

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate governance contract
        run: node scripts/validate-governance.mjs origin/${{ github.base_ref }}

      - name: Validate history integrity
        run: node scripts/validate-history-integrity.mjs origin/${{ github.base_ref }}
